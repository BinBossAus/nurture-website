<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <title>Nurture — Social Profile Picture Master</title>
  <desc>Nurture Parenting Magazine social avatar mark — the "Ring Seal". Espresso Earth #3A2D28 tile, hairline Porcelain Ivory #FDFBF7 ring, centered "N", Rose Gold #CBB1A5 jewel mark. Outlined vector (Playfair Display Medium), no font dependency. Designed and tested to survive circular cropping (Instagram, Facebook, LinkedIn, X all crop profile photos to a circle).</desc>
