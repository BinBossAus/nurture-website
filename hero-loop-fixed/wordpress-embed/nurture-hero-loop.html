<!--
  NURTURE HERO BACKGROUND LOOP — standalone WordPress/Avada embed
  =============================================================
  This is a plain full-viewport background video container: no copy, no
  navigation dots, no GSAP/ScrollTrigger. It plays four scenes back-to-back
  as one continuous, silent, looping sequence (canopy -> close -> orchard ->
  reach-wide -> back to canopy), cross-fading between them with a CSS
  opacity transition driven by the video "ended" event.

  HOW TO USE (Avada / Fusion Builder):
    1. All media files (canopy.mp4, close.mp4, orchard.mp4, reach-wide.mp4,
       their poster images, and grain.png) are already uploaded to the
       WordPress Media Library and live at
       https://www.nurtureparentingmagazine.com.au/wp-content/uploads/2026/08/
       — every URL below already points there. If WordPress ever re-uploads
       these to a different month folder, re-run a find & replace on that
       path.
    2. In Fusion Builder, add a "Code" element (or in Gutenberg, a "Custom
       HTML" block) to the page/section where the hero should live, and
       paste this ENTIRE file's contents into it.
    3. This container is intentionally bare — build headings, subtext, and
       any buttons/nav directly in Avada as elements layered on top of this
       code block (e.g. in a Fusion Builder container with this code block
       set as an absolutely-positioned/background layer).
  -->
<div id="nurture-hero-loop">
  <style>
    #nurture-hero-loop {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background-color: #3a2d28;
    }
    #nurture-hero-loop video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }
    #nurture-hero-loop video.is-active {
      opacity: 1;
    }
    #nurture-hero-loop .hero-tint {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-color: rgba(58, 45, 40, 0.35);
    }
    #nurture-hero-loop .hero-grain {
      position: absolute;
      inset: -40%;
      width: 180%;
      height: 180%;
      pointer-events: none;
      opacity: 0.055;
      mix-blend-mode: overlay;
      background-image: url("https://www.nurtureparentingmagazine.com.au/wp-content/uploads/2026/08/grain.png");
      background-size: 240px 240px;
      animation: nrt-hero-grain 0.48s steps(4) infinite;
    }
    @keyframes nrt-hero-grain {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-1.2%, 0.8%); }
      50% { transform: translate(1%, -1%); }
      75% { transform: translate(-0.6%, -0.4%); }
      100% { transform: translate(0, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      #nurture-hero-loop .hero-grain { animation: none; }
    }
  </style>

  <video
    id="nrt-video-canopy"
    class="is-active"
    src="https://www.nurtureparentingmagazine.com.au/wp-content/uploads/2026/08/canopy.mp4"
    poster="https://www.nurtureparentingmagazine.com.au/wp-content/uploads/2026/08/canopy.jpg"
    muted
    playsinline
    preload="auto"
  ></video>
  <video
    id="nrt-video-close"
    src="https://www.nurtureparentingmagazine.com.au/wp-content/uploads/2026/08/close.mp4"
    poster="https://www.nurtureparentingmagazine.com.au/wp-content/uploads/2026/08/close.jpg"
    muted
    playsinline
    preload="auto"
  ></video>
  <video
    id="nrt-video-orchard"
    src="https://www.nurtureparentingmagazine.com.au/wp-content/uploads/2026/08/orchard.mp4"
    poster="https://www.nurtureparentingmagazine.com.au/wp-content/uploads/2026/08/orchard.jpg"
    muted
    playsinline
    preload="auto"
  ></video>
  <video
    id="nrt-video-reach"
    src="https://www.nurtureparentingmagazine.com.au/wp-content/uploads/2026/08/reach-wide.mp4"
    poster="https://www.nurtureparentingmagazine.com.au/wp-content/uploads/2026/08/reach-wide.jpg"
    muted
    playsinline
    preload="auto"
  ></video>

  <div class="hero-tint" aria-hidden="true"></div>
  <div class="hero-grain" aria-hidden="true"></div>
</div>

<script>
(function () {
  function init() {
    var root = document.getElementById("nurture-hero-loop");
    if (!root) return;

    // Playback order: canopy -> close -> orchard -> reach-wide -> loop back to canopy.
    var ids = ["nrt-video-canopy", "nrt-video-close", "nrt-video-orchard", "nrt-video-reach"];
    var videos = ids.map(function (id) { return document.getElementById(id); }).filter(Boolean);
    if (!videos.length) return;

    function showVideo(index) {
      videos.forEach(function (video, i) {
        if (i === index) {
          video.classList.add("is-active");
          try { video.currentTime = 0; } catch (e) {}
          var playPromise = video.play();
          if (playPromise && typeof playPromise.catch === "function") {
            playPromise.catch(function () {});
          }
        } else {
          video.classList.remove("is-active");
          if (!video.paused) video.pause();
        }
      });
    }

    videos.forEach(function (video, i) {
      video.addEventListener("ended", function () {
        var next = (i + 1) % videos.length;
        showVideo(next);
      });
    });

    showVideo(0);
  }

  if (document.readyState === "complete" || document.readyState === "interactive") {
    setTimeout(init, 0);
  } else {
    document.addEventListener("DOMContentLoaded", init);
  }
})();
</script>
